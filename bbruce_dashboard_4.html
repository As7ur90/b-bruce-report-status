.logo-text{font-family:'DM Sans',sans-serif;font-weight:700;font-size:18px;color:white;letter-spacing:-0.03em;}

.logo-label{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.08em;text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

.week-bar{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;gap:12px;height:44px;overflow-x:auto;}
.week-bar-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--g4);text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap;flex-shrink:0;}
.week-pills{display:flex;gap:6px;}
.pill{font-family:'DM Mono',monospace;font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--g2);background:transparent;color:var(--g4);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.pill:hover{border-color:var(--black);color:var(--black);}
.pill.active{background:var(--black);color:white;border-color:var(--black);}

.page{max-width:1180px;margin:0 auto;padding:2rem;}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.03em;}
.page-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--g4);margin-top:4px;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:1rem;}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.75rem;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;}
.stat-card.red{background:var(--red);border-color:var(--red);}
.stat-card.red .stat-num,.stat-card.red .stat-lbl{color:white;}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-0.04em;line-height:1;}
.stat-lbl{font-size:10px;color:var(--g4);margin-top:4px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}

.alerts-wrap{margin-bottom:1.5rem;}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:6px;margin-bottom:6px;font-size:13px;line-height:1.5;}
.alert-item.danger{background:var(--red-dim);border-left:3px solid var(--red);}
.alert-item.warn{background:var(--amber-dim);border-left:3px solid #C97B00;}
.alert-item.info{background:rgba(26,92,154,0.07);border-left:3px solid #1A5C9A;}

.dept-section{margin-bottom:2rem;}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--black);}
.dept-accent{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.dept-title{font-size:11px;font-family:'DM Mono',monospace;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;}
.dept-count{font-size:11px;font-family:'DM Mono',monospace;color:var(--g4);margin-left:auto;}
.persons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:8px;}

.person-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:1rem;position:relative;transition:box-shadow 0.15s;}
.person-card.load-high,.person-card.load-mid,.person-card.load-low,.person-card.load-none{background:var(--white);}
.person-card:hover{box-shadow:0 3px 14px rgba(0,0,0,0.07);}

.person-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;font-family:'DM Mono',monospace;}
.person-name{font-size:14px;font-weight:600;letter-spacing:-0.01em;}
.person-role{font-size:11px;color:var(--g4);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}



.load-wrap{margin:8px 0;}

.load-mid .load-pct{color:#C97B00;}
.load-low .load-pct{color:var(--green);}
.load-none .load-pct{color:var(--g3);}
.load-bg{height:5px;background:var(--g2);border-radius:99px;overflow:hidden;}
.load-fill{height:100%;border-radius:99px;}

.load-low .load-fill{background:var(--green);}

// ────────────────────────────────────────────────────────────────
const TAG_LABELS = { block:'Bloquejat', active:'En curs', quick:'Tasca ràpida', feedback:'Esperant feedback', pending:'Pendent' };

function loadClass(p){ return p>=80?'load-high':p>=50?'load-mid':p>0?'load-low':'load-none'; }

function renderWeek(week) {
  const el = document.createElement('div');
  el.className = 'week-view';
  el.id = week.id;

  // Stats only from productive depts (non-mgmt)
  const prodMembers = week.departments.filter(d=>!d.mgmt).flatMap(d=>d.members);
  const overloaded = prodMembers.filter(m=>m.pct>=80).length;
  const medium = prodMembers.filter(m=>m.pct>=50&&m.pct<80).length;
  const available = prodMembers.filter(m=>m.pct<50&&m.pct>0).length;
  const free = prodMembers.filter(m=>!m.pct||m.pct===0).length;
  const active = prodMembers.flatMap(m=>m.projects).filter(p=>p.type==='active'||p.type==='block').length;
  const statsHTML = `<div class="stats-row">
    <div class="stat-card" style="background:#CC2929;border-color:#CC2929;">
      <div class="stat-num" style="color:white;">${overloaded||'0'}</div>
      <div class="stat-lbl" style="color:rgba(255,255,255,0.7);">Alta càrrega ≥80%</div>
    </div>
    <div class="stat-card" style="background:#A05C00;border-color:#A05C00;">
      <div class="stat-num" style="color:white;">${medium||'0'}</div>
      <div class="stat-lbl" style="color:rgba(255,255,255,0.7);">Càrrega mitjana 50–79%</div>
    </div>
    <div class="stat-card" style="background:#1A7A4A;border-color:#1A7A4A;">
      <div class="stat-num" style="color:white;">${available+free||'0'}</div>
      <div class="stat-lbl" style="color:rgba(255,255,255,0.7);">Disponibles &lt;50%</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${active||'—'}</div>
      <div class="stat-lbl">Projectes en curs</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${week.fites?.length||'—'}</div>
      <div class="stat-lbl">Fites setmana</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--black);font-family:'DM Mono',monospace;font-weight:600;margin:-1rem 0 1.5rem;text-align:right;"><strong>Equip productiu: ${prodMembers.length}</strong> &nbsp;·&nbsp; Total equip: ${week.stats.persones} &nbsp;<span style="color:var(--g4);font-weight:400;">(ocupació calculada sobre equip productiu)</span></div>`;

  const alertsHTML = week.alerts.length
    ? `<div class="alerts-wrap">${week.alerts.map(a=>`<div class="alert-item ${a.type}">${a.text}</div>`).join('')}</div>`
    : '';

  const deptsHTML = week.departments.map(dept=>`
    <div class="dept-section${dept.mgmt?' mgmt':''}">
      <div class="dept-head">
        <div class="dept-accent" style="background:${dept.accent};"></div>
        <span class="dept-title">${dept.label}</span>
        <span class="dept-count">${dept.members.length} persones</span>
      </div>
      <div class="persons-grid">${dept.members.map(m=>{
        const lc = loadClass(m.pct);
        const projRows = m.projects.length
          ? m.projects.map(p=>`
              <div class="proj-item">
                <div class="proj-dot ${p.type}"></div>
                <div style="flex:1;min-width:0;">
                  <div class="proj-name">${p.name.includes("—") ? "<strong>"+p.name.split("—")[0].trim()+"</strong> — "+p.name.split("—").slice(1).join("—").trim() : p.name}</div>
                  ${p.note?`<div class="proj-note">${p.note}</div>`:''}
                </div>
                <span class="proj-tag ${p.type}">${TAG_LABELS[p.type]||p.type}</span>
              </div>`).join('')
          : `<div class="no-data">Pendent de transcript...</div>`;
        return `
          <div class="person-card ${lc}${m.responsible?' responsible':''}">
            <div class="person-top">
              <div class="avatar" style="background:${m.avatarBg};color:${m.avatarTxt};">${m.initials}</div>
              <div style="flex:1;min-width:0;">
                <div class="person-name">${m.name}${m.responsible?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--black);margin-left:6px;vertical-align:2px;" title="Responsable"></span>':''}</div>
                <div class="person-role">${m.role}</div>
              </div>

            </div>
            <div class="load-wrap">
              <div class="load-head">
                <span class="load-label">ocupació estimada</span>
                <span class="load-pct">${m.pct>0?m.pct+'%':'—'}</span>
              </div>
              <div class="load-bg"><div class="load-fill" style="width:${m.pct}%"></div></div>
            </div>
            <div class="projs">${projRows}</div>
          </div>`;
      }).join('')}</div>
    </div>`).join('');

  const TAG_TEXT = { avui:'Avui', setmana:'Aquesta setmana', pendent:'Pendent', hores:'Hores' };
  const hitosHTML = week.fites && week.fites.length
    ? week.fites.map(h=>`
        <div class="hito-row">
          <span class="hito-who">${h.who}</span>
          <div style="flex:1;min-width:0;">
            <div class="hito-text">${h.text}</div>
            ${h.hours?`<div class="hito-note">⏱ ${h.hours}h estimades · ${Math.round(h.hours/37.5*100)}% de la jornada setmanal</div>`:''}
            ${h.note?`<div class="hito-note">${h.note}</div>`:''}
          </div>
          <span class="hito-tag ${h.tag}">${TAG_TEXT[h.tag]||h.tag}</span>
        </div>`).join('')
    : `<div class="hito-row">
        <span class="hito-who">—</span>
        <div style="flex:1;"><span class="hito-text" style="color:var(--g3);font-style:italic;">Els compromisos i fites de la reunió apareixeran aquí.</span></div>
        <span class="hito-tag pendent">Pendent</span>
      </div>`;

  el.innerHTML = `<div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">Ocupació de l'equip</div>
        <div class="page-meta">${week.dateRange} · Generat el ${week.generatedAt}</div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.5rem;">
      <span class="proj-tag block">● Bloquejat / Projecte gran</span>
      <span class="proj-tag active">● En curs actiu</span>
      <span class="proj-tag quick">● Tasca ràpida</span>
      <span class="proj-tag feedback">● Esperant feedback</span>
      <span class="proj-tag pending">● Pendent / Incert</span>
    </div>
    ${statsHTML}
    ${alertsHTML}
    ${deptsHTML}
    <div class="fites-section">
      <div class="fites-header">
        <span class="fites-title-main">Fites i compromisos de la setmana</span>
        <span class="fites-subtitle">37,5h / persona · setmana laboral dilluns—divendres</span>
      </div>
      <div class="hitos-card">${hitosHTML}</div>
    </div>
    <div class="footer">
      <span class="footer-note">B—BRUCE · Dashboard generat des de transcript · Otter.ai → Claude</span>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div>Alta càrrega (≥80%)</div>
        <div class="leg-item"><div class="leg-dot" style="background:#C97B00"></div>Càrrega mitjana (40–79%)</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Disponible (&lt;40%)</div>
      </div>
    </div>
  </div>`;
  return el;
}

function showWeek(id) {
  document.querySelectorAll('.week-view').forEach(v=>v.classList.remove('visible'));
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('visible');
  document.querySelector(`.pill[data-id="${id}"]`).classList.add('active');
  const w = WEEKS.find(x=>x.id===id);
  if(w) document.getElementById('topbar-week').textContent = w.dateRange;
}

(function init(){
  const container = document.getElementById('weeks-container');
  const pillsEl   = document.getElementById('week-pills');
  WEEKS.forEach((week,i)=>{
    const pill = document.createElement('button');
    pill.className = 'pill'+(i===0?' active':'');
    pill.textContent = week.label;
    pill.dataset.id = week.id;
    pill.addEventListener('click',()=>showWeek(week.id));
    pillsEl.appendChild(pill);
    const view = renderWeek(week);
    if(i===0){ view.classList.add('visible'); document.getElementById('topbar-week').textContent=week.dateRange; }
    container.appendChild(view);
  });
})();
</script>
